name: Execution sync and Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check Apps Script readiness
        id: credentials
        env:
          SCRIPT_URL: ${{ secrets.APPS_SCRIPT_EXECUTION_URL }}
          SYNC_KEY: ${{ secrets.APPS_SCRIPT_SYNC_KEY }}
        run: |
          if [ -n "$SCRIPT_URL" ] && [ -n "$SYNC_KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Private execution transport is not configured; keeping the last good snapshot.'
          fi
      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.credentials.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-execution.txt
      - name: Install read-only adapter dependencies
        if: github.event_name != 'schedule' || steps.credentials.outputs.ready == 'true'
        run: python -m pip install -r requirements-execution.txt
      - name: Isolated regression checks
        if: github.event_name != 'schedule' || steps.credentials.outputs.ready == 'true'
        run: |
          python -m unittest test_execution_sync test_apps_script_transport test_publication_guard test_alerts -q
          node test_snapshot_guard.cjs
      - name: Read four execution sheets through Apps Script
        if: github.event_name != 'push' && steps.credentials.outputs.ready == 'true'
        env:
          APPS_SCRIPT_EXECUTION_URL: ${{ secrets.APPS_SCRIPT_EXECUTION_URL }}
          APPS_SCRIPT_SYNC_KEY: ${{ secrets.APPS_SCRIPT_SYNC_KEY }}
        run: python apps_script_transport.py
      - name: Save aggregate snapshot and sync status
        if: github.event_name != 'push' && steps.credentials.outputs.ready == 'true'
        run: |
          python publication_guard.py publish --module execution
      - name: Package public static files only
        if: github.event_name != 'schedule' || steps.credentials.outputs.ready == 'true'
        run: python publication_guard.py package --output _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.credentials.outputs.ready == 'true'
        with:
          path: _site
      - name: Reject superseded build before deployment
        if: github.event_name != 'schedule' || steps.credentials.outputs.ready == 'true'
        run: python publication_guard.py check-latest --output _site
      - name: Deploy validated snapshot
        id: deployment
        if: github.event_name != 'schedule' || steps.credentials.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
