name: Execution sync and Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Apps Script readiness
        id: credentials
        env:
          SCRIPT_URL: ${{ secrets.APPS_SCRIPT_EXECUTION_URL }}
          SYNC_KEY: ${{ secrets.APPS_SCRIPT_SYNC_KEY }}
        run: |
          if [ -n "$SCRIPT_URL" ] && [ -n "$SYNC_KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Private execution transport is not configured; keeping the last good snapshot.'
          fi
      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.credentials.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-execution.txt
      - name: Install read-only adapter dependencies
        if: github.event_name != 'schedule' || steps.credentials.outputs.ready == 'true'
        run: python -m pip install -r requirements-execution.txt
      - name: Isolated regression checks
        if: github.event_name != 'schedule' || steps.credentials.outputs.ready == 'true'
        run: python -m unittest test_execution_sync test_apps_script_transport -q
      - name: Read four execution sheets through Apps Script
        if: github.event_name != 'push' && steps.credentials.outputs.ready == 'true'
        env:
          APPS_SCRIPT_EXECUTION_URL: ${{ secrets.APPS_SCRIPT_EXECUTION_URL }}
          APPS_SCRIPT_SYNC_KEY: ${{ secrets.APPS_SCRIPT_SYNC_KEY }}
        run: python apps_script_transport.py
      - name: Save aggregate snapshot and sync status
        if: github.event_name != 'push' && steps.credentials.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add execution.json execution-data.js
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily execution snapshot and sync status'
            git push origin HEAD:main
          fi
      - name: Package public static files only
        if: github.event_name != 'schedule' || steps.credentials.outputs.ready == 'true'
        run: |
          mkdir _site
          cp .nojekyll index.html style.css app.js summary.json summary-data.js targets.json targets-data.js targets.js execution.json execution-data.js execution-sync.js _site/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.credentials.outputs.ready == 'true'
        with:
          path: _site
      - name: Deploy validated snapshot
        id: deployment
        if: github.event_name != 'schedule' || steps.credentials.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
